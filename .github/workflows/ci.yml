name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump for the release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/guest-wifi-portal

jobs:
  portal-tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: guest-wifi-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (container starts and /healthz answers)
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e SECRET_KEY=ci -e WORKERS_ENABLED=false -e SESSION_COOKIE_SECURE=false \
            guest-wifi-portal:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1

  # The one check branch protection requires. It fails if any job above failed or was cancelled.
  ci-ok:
    name: CI passed
    if: always()
    needs: [portal-tests, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]

  # Dependabot PRs merge themselves once every check passed.
  automerge:
    name: Merge Dependabot PR
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Merge, or ask Dependabot to rebase if main moved on
        run: |
          state=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
          echo "merge state: $state"
          if [ "$state" = "BEHIND" ]; then
            gh pr comment "$PR" --body "@dependabot rebase"
            exit 0
          fi
          gh pr merge "$PR" --merge --delete-branch
          # A merge made with GITHUB_TOKEN doesn't start a push run, so start the release run on main.
          gh workflow run ci.yml --ref main

  publish:
    name: Publish image and release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            next=0.1.0
          elif git tag --points-at HEAD | grep -qx "$last"; then
            echo "HEAD is already released as $last"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *)     next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next (previous: ${last:-none})"
      - if: steps.version.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.version.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.version.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short
      - if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --generate-notes \
            --notes "Image: \`${IMAGE}:$V\`"
