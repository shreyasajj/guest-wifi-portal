{% extends "guest/base.html" %}
{% block card %}
<h1>You're in!</h1>
<form class="form" method="post" action="/device" data-once>
  <p class="ttl">What kind of device is this?</p>
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  {% if error %}<div class="alert bad" role="alert">{{ error }}</div>{% endif %}
  <fieldset class="tiles" style="border:0;padding:0;margin:0">
    <legend class="sr">Device type</legend>
    {% set icons = {
      'phone': '<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>',
      'computer': '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
      'tablet': '<rect x="4" y="2" width="16" height="20" rx="2.5"/><path d="M11 18h2"/>',
      'other': '<circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>'} %}
    {% for t in ['phone','computer','tablet','other'] %}
    <div class="tile">
      <input type="radio" name="device_type" id="t-{{ t }}" value="{{ t }}" {% if (device_type or 'phone') == t %}checked{% endif %}>
      <label for="t-{{ t }}"><svg viewBox="0 0 24 24" aria-hidden="true">{{ icons[t]|safe }}</svg>{{ t|capitalize }}</label>
    </div>
    {% endfor %}
  </fieldset>
  <div class="field"><div><label for="nickname">Nickname (optional)</label>
    <input id="nickname" name="nickname" maxlength="60" value="{{ nickname or '' }}" placeholder="{{ first_name }}'s phone"></div></div>
  <button class="btn" type="submit">Finish</button>
  <div class="dots" aria-hidden="true"><i></i><i class="on"></i><i></i></div>
</form>
{% endblock %}
